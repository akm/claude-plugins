# 各プラグインの自動テストを GitHub Actions で実行する。
#
# 対象の一覧はこのファイルに書かず、リポジトリが追跡しているファイル (コマンド `git ls-files` が挙げるファイル) から見つける。
# - Python: ファイル `test_*.py` を含むディレクトリごとに `python3 -m unittest discover -s <ディレクトリ>`。
#   そのディレクトリの親にファイル `.python-version` があればその版の Python で、無ければ 3.11 で実行する。
#   親にファイル `pyproject.toml` があれば、そのパッケージを editable で入れてからテストを実行する (依存も一緒に入る)。
#   ファイル `uv.lock` を含むディレクトリの `python/tests` は、種類 uv が検査するので除く (その下のほかのディレクトリは除かない)
# - Go: ファイル `go.mod` を含むディレクトリごとに `go test ./...`
# - Node.js (種類 node): ファイル `tests/*.test.ts` とファイル `package-lock.json` の両方を含むディレクトリごとに、
#   Node.js 24 で `npm ci` の後に `npm test` (型の検査・lint・テストを続けて実行する npm のスクリプト)。
#   `package-lock.json` だけを含むディレクトリ (テストの無い wording-guard/textlint など) は対象にしない
# - uv (種類 uv): ファイル `uv.lock` を含むディレクトリごとに、`uv sync --frozen` の後に `uv run mypy python` と
#   `uv run python -m unittest discover -s python/tests`。Python の版は、そのディレクトリのファイル `.python-version` で uv が決める
# 見つけた対象はファイル `.github/test-targets.txt` の期待の一覧と種類ごとに比べ、差があれば失敗にする (対象が減っても増えても気づけるように)。
# 新しいプラグインがこの命名に従ってテストを置き、一覧に 1 行足せば、このファイルを変えずに CI の対象になる。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチ (PR なら同じ PR) で新しい実行が始まったら、まだ終わっていない古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-dirs: ${{ steps.list.outputs.python-dirs }}
      go-modules: ${{ steps.list.outputs.go-modules }}
      node-dirs: ${{ steps.list.outputs.node-dirs }}
      uv-dirs: ${{ steps.list.outputs.uv-dirs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: List test targets
        run: |
          uv_dirs=$(git ls-files | grep -E '(^|/)uv\.lock$' | xargs -r -n1 dirname | sort -u)
          # uv.lock のあるディレクトリの python/tests は種類 uv が実行するので、種類 python の対象から除く。
          # 種類 uv が実行しないほかのディレクトリまで除くと、どのジョブにも実行されず、一覧との比較でも検出されない
          python_dirs=$(git ls-files | grep -E '(^|/)test_[^/]*\.py$' | xargs -r -n1 dirname | sort -u | while read -r d; do
            for u in $uv_dirs; do case "$d" in ("$u"/python/tests) continue 2 ;; esac; done
            echo "$d"
          done)
          go_modules=$(git ls-files | grep -E '(^|/)go\.mod$' | xargs -r -n1 dirname | sort -u)
          # tests/*.test.ts の 2 つ上のディレクトリのうち、package-lock.json を追跡しているもの
          node_dirs=$(git ls-files | grep -E '(^|/)tests/[^/]*\.test\.ts$' | xargs -r -n1 dirname | xargs -r -n1 dirname | sort -u | while read -r d; do
            # 本体の最後を「条件 && echo」にすると、最後の候補を除いたときにループの終了ステータスが 1 になり、
            # bash -e で動くこの手順が理由を示さずに終了するので、if で書く
            if git ls-files --error-unmatch "$d/package-lock.json" > /dev/null 2>&1; then echo "$d"; fi
          done)
          printf 'Python:\n%s\nGo:\n%s\nNode.js:\n%s\nuv:\n%s\n' "$python_dirs" "$go_modules" "$node_dirs" "$uv_dirs"
          # 1 つも見つからないときは、テストが無いまま合格したように見えないよう失敗にする
          [ -n "$python_dirs" ] || { echo "::error::test_*.py が 1 つも見つからない"; exit 1; }
          [ -n "$go_modules" ] || { echo "::error::go.mod が 1 つも見つからない"; exit 1; }
          [ -n "$node_dirs" ] || { echo "::error::tests/*.test.ts と package-lock.json の両方を含むディレクトリが 1 つも見つからない"; exit 1; }
          [ -n "$uv_dirs" ] || { echo "::error::uv.lock が 1 つも見つからない"; exit 1; }
          # 見つけた対象を期待の一覧と種類ごとに比べる。一覧にあるのに見つからないもの (改名・移動・削除で対象から外れた) と、
          # 見つかったのに一覧に無いもの (足したが一覧に書いていない) を挙げて失敗にする
          expected=.github/test-targets.txt
          ok=1
          for kind in python go node uv; do
            case "$kind" in
              python) actual=$python_dirs ;;
              go) actual=$go_modules ;;
              node) actual=$node_dirs ;;
              uv) actual=$uv_dirs ;;
            esac
            listed=$(grep -E "^$kind " "$expected" | cut -d' ' -f2- | sort -u)
            missing=$(comm -23 <(printf '%s\n' "$listed") <(printf '%s\n' "$actual"))
            unlisted=$(comm -13 <(printf '%s\n' "$listed") <(printf '%s\n' "$actual"))
            [ -z "$missing" ] || { echo "::error::$kind: $expected にあるのに見つからない: $(echo $missing)"; ok=0; }
            [ -z "$unlisted" ] || { echo "::error::$kind: 見つかったのに $expected に無い: $(echo $unlisted)"; ok=0; }
          done
          [ "$ok" = 1 ] || exit 1
          echo "python-dirs=$(printf '%s\n' "$python_dirs" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "go-modules=$(printf '%s\n' "$go_modules" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "node-dirs=$(printf '%s\n' "$node_dirs" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "uv-dirs=$(printf '%s\n' "$uv_dirs" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  python:
    name: python (${{ matrix.dir }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.python-dirs) }}
    steps:
      - uses: actions/checkout@v7
      - id: python-version
        name: Decide Python version
        env:
          TEST_DIR: ${{ matrix.dir }}
        # 既定の 3.11 は、pr-teeth が前提とする下限 (設定の読み込みに Python 3.11 以降の標準ライブラリ tomllib を使う)。
        # それより新しい版を要るパッケージ (doc-structured のツールなど) は、テストのディレクトリの親の .python-version で指定する
        run: |
          parent=$(dirname "$TEST_DIR")
          if [ -f "$parent/.python-version" ]; then
            version=$(tr -d '[:space:]' < "$parent/.python-version")
          else
            version=3.11
          fi
          echo "Python $version ($TEST_DIR)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - name: Install the package under test
        env:
          TEST_DIR: ${{ matrix.dir }}
        run: |
          parent=$(dirname "$TEST_DIR")
          if [ -f "$parent/pyproject.toml" ]; then
            python3 -m pip install --quiet --disable-pip-version-check --editable "$parent"
          else
            echo "pyproject.toml が無いので、何も入れない ($parent)"
          fi
      - name: unittest
        env:
          TEST_DIR: ${{ matrix.dir }}
        # Python 3.11 の unittest はテストが 0 件でも終了コード 0 を返す (0 件を 5 にするのは 3.12 以降) ので、
        # 終了コードに加えて実行件数の行を見て、1 件も実行していなければ失敗にする
        run: |
          set -o pipefail
          python3 -m unittest discover -s "$TEST_DIR" 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if grep -q '^Ran 0 tests' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::テストが 1 件も実行されていない: $TEST_DIR"
            exit 1
          fi

  go:
    name: go (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.go-modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # モジュールが対応する最小のバージョン (go.mod の go ディレクティブ) で検証する
          go-version-file: ${{ matrix.module }}/go.mod
          # 依存のキャッシュは go.sum の無いモジュールで失敗するので使わない (依存は少なく、毎回取得しても時間はかからない)
          cache: false
      - name: go test
        env:
          MODULE: ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        # go test はテストファイルの無いパッケージを「?   … [no test files]」と表示して終了コード 0 を返すので、
        # テストを実行したパッケージ (先頭が ok の行) が 1 つも無ければ失敗にする
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          if ! grep -q '^ok[[:space:]]' "$RUNNER_TEMP/gotest.log"; then
            echo "::error::テストを実行したパッケージが無い: $MODULE"
            exit 1
          fi

  node:
    name: node (${{ matrix.dir }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.node-dirs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # .ts のファイルを変換せずに実行できる版 (計画 docs/plans/2026-11-09-2343-feat-slide-deck-plugin-plan.md の KTD3)
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: npm test
        env:
          TEST_DIR: ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        # node --test は、テストが 0 件でも終了コード 0 を返すので、spec の形式の出力の件数の行を見て、
        # 1 件も実行していなければ失敗にする (形式は npm のスクリプト test が --test-reporter=spec で決めている)
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npmtest.log"
          if ! grep -qE '^ℹ tests [1-9][0-9]*$' "$RUNNER_TEMP/npmtest.log"; then
            echo "::error::テストが 1 件も実行されていない: $TEST_DIR"
            exit 1
          fi

  uv:
    name: uv (${{ matrix.dir }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.uv-dirs) }}
    env:
      # uv run が uv.lock を作り直さず、uv.lock のとおりに入れた環境で実行する
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: ${{ matrix.dir }}/uv.lock
      - name: uv sync
        working-directory: ${{ matrix.dir }}
        run: uv sync --frozen
      - name: mypy
        working-directory: ${{ matrix.dir }}
        run: uv run mypy python
      - name: unittest
        env:
          TEST_DIR: ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        # 種類 python のジョブと同じく、実行件数の行を見て、1 件も実行していなければ失敗にする
        run: |
          set -o pipefail
          uv run python -m unittest discover -s python/tests 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if grep -q '^Ran 0 tests' "$RUNNER_TEMP/unittest.log"; then
            echo "::error::テストが 1 件も実行されていない: $TEST_DIR/python/tests"
            exit 1
          fi
