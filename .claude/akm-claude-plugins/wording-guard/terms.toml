# ---- 英語を直訳した訓読みの語 (#135) ----
#
# 語を選ぶ優先順は #135 の本文のとおり。識別子・正式な用語・手順書に書かれうるものはそのまま使い、
# 次に浸透したカタカナ語、次に音読みの二字漢語を選ぶ。英語を直訳した訓読みの語は避ける。

[[terms]]
pattern = "/確かめ/"
verdict = "avoid"
replacements = ["確認する", "確認の方法"]
reason = "英語 (check / verify) を直訳した訓読みの語。音読みの二字漢語「確認」がある"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "置き場"
verdict = "avoid"
replacements = ["ディレクトリ", "保存先", "配置先"]
reason = "英語 (location) を直訳した訓読みの語。実体がディレクトリなら「ディレクトリ」、保存する場所なら「保存先」、置く場所なら「配置先」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "/(?<![一-龯々])止(ま|め|っ)/"
verdict = "avoid"
replacements = ["停止する", "中断する", "拒否する"]
reason = "英語 (stop) を直訳した訓読みの語。プロセス・待機は「停止」、手順を途中でやめて人間に返すのは「中断」、サンドボックスや hook が実行させないのは「拒否」と書く。3 つのどれにも当たらなければ、何が起きるかを書く (「実行が返らなくなる」など)。hook の終了コードの扱いは、Claude Code の文書の用語 (non-blocking error など) で書く。前が漢字の形 (二字漢語の「停止」、和語の複合名詞の「通行止め」、漢字に続く動詞の「一度止められた」) は検出しないので、目で確認する"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "答え"
verdict = "avoid"
replacements = ["回答", "回答する"]
reason = "英語 (answer) を直訳した訓読みの語。音読みの二字漢語「回答」がある"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "終わ"
verdict = "avoid"
replacements = ["終了", "完了"]
exceptions = ["` で終わ", "で終わる名前", "で終わる文字列"]
reason = "英語 (end / finish) を直訳した訓読みの語。プロセス・コマンド・待機は「終了」、作業・割り当ては「完了」と書く。文字列の末尾を言う用法は、末尾の文字列をバッククォートで囲んだ形 (「`.md` で終わる」) と、「で終わる名前」「で終わる文字列」だけを対象にしない。囲まない書き方は検出する"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "尋ね"
verdict = "avoid"
replacements = ["質問する"]
reason = "英語 (ask) を直訳した訓読みの語。利用者への質問を指すので「質問」と書く (データの照会ではないので「クエリ」ではない)"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "/問い(?!合)/"
verdict = "avoid"
replacements = ["質問", "判定の条件", "確認項目"]
reason = "英語 (question) を直訳した訓読みの語。利用者への質問は「質問」、チェックリストの項目は「判定の条件」か「確認項目」と書く。「問い合わせ」は対象にしない"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "/(?<![一-龯々ァ-ヶー])待ち|待(つ|た|て|っ)/"
verdict = "avoid"
replacements = ["待機", "待機する"]
reason = "英語 (wait) を直訳した訓読みの語。音読みの二字漢語「待機」がある。前が漢字か片仮名の「〜待ち」(「選択待ち」「ロック待ち」のような複合語) は対象にしない (許容する語)。動詞の活用形 (「秒待って」など) は前の文字に関わらず検出する。「待機」は目的語を取らないので、「〜を待つ」を「〜を待機する」と書かない。待つ出来事が、前が漢字の名詞なら「〜待ち」(「回答待ちの間」)、そうでなければ「〜まで待機する」(「Issue の完了まで待機する」) と書く。待つ相手は「〈待つ出来事〉待ちの相手」(「完了待ちの相手」「回答待ちの相手」)、待つ理由は「待機の理由」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "見分け"
verdict = "avoid"
replacements = ["判別", "識別"]
reason = "英語 (distinguish) を直訳した訓読みの語。区別がつくかは「判別」、どれかを特定するのは「識別」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "欠け"
verdict = "avoid"
replacements = ["欠損", "無い", "不足する"]
reason = "英語 (missing) を直訳した訓読みの語。名詞は「欠損」、動詞「欠ける」は「無い」「不足する」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "続き"
verdict = "avoid"
replacements = ["次の", "残り", "継続"]
exceptions = ["手続き", "引き続き", "続き、", "続きま"]
reason = "英語 (continuation) を直訳した訓読みの語。「続きのページ」は「次のページ」、ほかは「残り」「継続」と書く。動詞「続く」の連用形 (「続き、」) とます形 (「続きます」) は対象にしない"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "書き手"
verdict = "avoid"
replacements = ["投稿者", "書き込み元", "筆者"]
reason = "英語 (writer) を直訳した訓読みの語。GitHub のコメントの作成者は「投稿者」、ファイル・フィールドに書くセッションやプログラムは「書き込み元」、文章を書く人は「筆者」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "読み手"
verdict = "avoid"
replacements = ["読者"]
reason = "英語 (reader) を直訳した訓読みの語。文章や出力を読む人は「読者」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "/(書く|読む)側/"
verdict = "avoid"
replacements = ["書き込み元", "読み込み先", "読み込み元"]
reason = "方向・位置の比喩で、何を指すかを読者に推測させる。プログラムやセッションがファイルを書く・読む意味では「書き込み元」「読み込み先」(主語によっては「読み込み元」) と書く。ファイルを読むプロセスを主語にする文は「(ファイルを) 読むプロセス」と書く。「読み込み先」「読み込み元」は、読まれるファイルとも読めるため"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "書き直"
verdict = "avoid"
replacements = ["修正", "上書き"]
reason = "英語 (rewrite) を直訳した訓読みの語。宣言・文章は「修正」、ファイルは「上書き」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "読み直"
verdict = "avoid"
replacements = ["再確認", "通読する", "再度読み込む"]
reason = "英語 (reread) を直訳した訓読みの語。人が確認し直すのは「再確認」、人が文書を最初から通して読むのは「通読」(範囲を読むだけなら「読む」)、プログラムが読むのは「再度読み込む」と書く"
decided_in = "https://github.com/akm/claude-plugins/issues/135"

[[terms]]
pattern = "/戻り(?!値)/"
