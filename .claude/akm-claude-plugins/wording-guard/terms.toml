# このリポジトリで言い換えを決めた語 (避ける語) と、使い続けると決めた語 (許容する語) の記録。
#
# このファイルは決めたことの例であって、検査の範囲ではない。ここに無い表現も、
# ルートの CLAUDE.md の「文書の表現」の 3 原則に照らして判断する。
# 様式の正本は wording-guard/skills/wording-guard/references/terms.md。
#
# #35 で言い換えた語のうち、パターンで表せるものを登録した。「落ちる」(意味が文脈で 3 つに分かれる) や
# 「守る」(正しい用法が多い) のように、字面で区別できない語は登録していない。
#
# #135 で、次の語も同じ理由で登録しないと決めた。文脈で書き分ける基準を残す。
#   - 振る舞い: 仕様として定めた・期待する動作は「振る舞い」、実際に観測した動作は「動作」と書く。
#   - 誤り: 人の作業の失敗 (書き間違い・書き忘れ・指定の取り違え) は「ミス」、値・入力・設定が規則に
#     合わない状態 (「入力の誤り」「設定の誤り」) は「誤り」と書く。
#   - 〜側: 対の両方を書く文 (「サーバー側とクライアント側」) でだけ使う。片方だけを書くなら「側」を使わず、
#     指すもの (セッション・コード・プロセス・記述など) を名前で書く (「呼び出し側」→「呼び出し元」)。

