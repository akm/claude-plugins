# このリポジトリで言い換えを決めた語 (避ける語) と、使い続けると決めた語 (許容する語) の記録。
#
# このファイルは決めたことの例であって、検査の範囲ではない。ここに無い言い回しも、
# ルートの CLAUDE.md の「文書の言い回し」の 3 原則に照らして判断する。
# 様式の正本は wording-guard/skills/wording-guard/references/terms.md。
#
# #35 で言い換えた語のうち、パターンで表せるものを登録した。「落ちる」(意味が文脈で 3 つに分かれる) や
# 「守る」(正しい用法が多い) のように、字面で区別できない語は登録していない。

# ---- CI の画面の色の比喩 (6ed9786) ----

[[terms]]
pattern = "/緑(になる|になっ|のまま|で通)/"
verdict = "avoid"
replacements = ["成功する", "合格する"]
reason = "CI の画面の色の比喩で、文脈が無いと通じない"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "/赤(くなる|くなっ|になる|になっ)/"
verdict = "avoid"
replacements = ["失敗する"]
reason = "CI の画面の色の比喩で、文脈が無いと通じない"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "全緑"
verdict = "avoid"
replacements = ["すべて成功する"]
reason = "CI の画面の色の比喩で、文脈が無いと通じない"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "グリーン"
verdict = "avoid"
replacements = ["成功する", "合格する"]
reason = "CI の画面の色の比喩で、文脈が無いと通じない"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

# ---- プログラムを人に喩える表現 (a4c21a3) ----

[[terms]]
pattern = "黙って"
verdict = "avoid"
replacements = ["利用者に知らせずに", "エラーを出さずに", "理由を示さずに"]
reason = "プログラムを人に喩えている。誰が気づかないのかを書く"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

# ---- 英語の直訳 ----

[[terms]]
pattern = "同じ型の"
verdict = "avoid"
replacements = ["同じ種類の"]
autofix = true
reason = "type の直訳。このリポジトリには Go のツールがあり、Go の型と読み違える (8ff14dd)"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "/型 ?[A-F](?![A-Za-z0-9])/"
verdict = "avoid"
replacements = ["観点"]
reason = "type の直訳。検証の観点 A〜F を指す (8ff14dd)"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "/畳(む|ま|み|ん)/"
verdict = "avoid"
replacements = ["そろえる", "まとめる"]
exceptions = ["折り畳み"]
reason = "fold / collapse の直訳。UI の折りたたみと紛らわしい (c5f0779)"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "二重化"
verdict = "avoid"
replacements = ["2 つに分かれる"]
reason = "何が 2 つになるのかが読み取れない (b7de269)"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

[[terms]]
pattern = "縮退"
verdict = "avoid"
replacements = ["意味をなさなくなる", "すり替わる"]
reason = "何がどう変わるのかが読み取れない (b7de269)"
decided_in = "https://github.com/akm/claude-plugins/issues/35"

