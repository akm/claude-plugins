<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; background: #ffffff; color: #1f2328; }
  h1 { font-size: 1.2rem; }
  .note { color: #57606a; font-size: 0.85rem; }
  #fallback { display: none; border: 1px solid #d1242f; background: #fff5f5; color: #d1242f;
              padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  pre.mermaid { background: transparent; }
</style>
</head>
<body>
<h1>__TITLE__</h1>
<p class="note">__NOTE__</p>
<div id="fallback">mermaid の読み込みに失敗しました。CDN への到達 (ネットワーク) を確認してください。図のソースは下にテキストのまま表示されています。</div>
<pre class="mermaid">
__DIAGRAM__
</pre>
<!-- mermaid.min.js は eval / new Function の中では動かないため、script 要素として読み込む -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"
        onerror="document.getElementById('fallback').style.display='block'"></script>
<script>
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: true });
  } else {
    document.getElementById('fallback').style.display = 'block';
  }
</script>
</body>
</html>
