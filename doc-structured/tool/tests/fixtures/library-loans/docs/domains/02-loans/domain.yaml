# 架空の題材「図書館の貸出」の、貸出のドメイン
domain:
  description: 図書の貸出と返却を扱う。
models:
  loan:
    name_ja: 貸出
    definition: 利用者が図書を借りてから返すまでの 1 回の記録。
    attributes:
      book:
        name_ja: 貸出図書
        definition: 貸し出した図書。
        refers_to: d-catalog-m-book
      member:
        name_ja: 借りた利用者
        definition: 図書を借りた利用者。
        refers_to: d-members-m-member
      reservation:
        name_ja: 元の予約
        definition: この貸出のもとになった予約。予約せずに借りたときは無い。
        refers_to: d-loans-m-reservation
      status:
        name_ja: 貸出状態
        definition: 貸出が今どの段階にあるか。
        values:
          on_loan:
            name_ja: 貸出中
            definition: 図書が利用者の手元にある。
          returned:
            name_ja: 返却済み
            definition: 図書が図書館に戻った。
unclassified_app_terms:
  business_day:
    name_ja: 開館日
    definition: 図書館が利用者に開いている日。休館日を除く。
preconditions:
  book_shelved:
    name_ja: 図書が配架中
    definition: 貸し出す図書が書架にある。
    targets:
      - d-catalog-m-book-a-shelf_status-v-shelved
  loan_on_loan:
    name_ja: 貸出が貸出中
    definition: 返す図書の貸出が、まだ返却されていない。
    targets:
      - d-loans-m-loan-a-status-v-on_loan
events:
  book_lent:
    name_ja: 図書を貸し出した
    definition: 図書が利用者の手元に移った。
  book_returned:
    name_ja: 図書が返却された
    definition: 図書が図書館に戻った。
