# 架空の題材「図書館の貸出」の、蔵書のドメインのテーブル
tables:
  books:
    model: d-catalog-m-book
    primary_key: [id]
    columns:
      id:
        type: text
        definition: 図書を識別する値。
      title:
        type: text
        attribute: d-catalog-m-book-a-title
      shelf_status:
        type: text
        default: "'shelved'"
        attribute: d-catalog-m-book-a-shelf_status
      call_number:
        type: text
        definition: 図書の請求記号。
        in_overview: true
      created_at:
        type: integer
        definition: 行を作った時刻 (UNIX 時刻のミリ秒)。
  categories:
    model: d-catalog-m-category
    primary_key: [id]
    columns:
      id:
        type: text
        definition: 分類を識別する値。
      name:
        type: text
        attribute: d-catalog-m-category-a-name
    indexes:
      - columns: [name]
        unique: true
  book_categories:
    attribute: d-catalog-m-book-a-categories
    primary_key: [book_id, category_id]
    columns:
      book_id:
        type: text
        definition: 分類を付けた図書。
        references: d-catalog-t-books-c-id
      category_id:
        type: text
        definition: 図書に付けた分類。
        references: d-catalog-t-categories-c-id
    indexes:
      - columns: [category_id]
