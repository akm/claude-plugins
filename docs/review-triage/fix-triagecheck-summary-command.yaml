runs:
  - date: "2026-09-02"
    skill: code-review
    run_id: ""
    model: opus-5
    level: high
    scope: full
    head: 33c62b8
    findings:
      - id: 1
        file: review-triage/tools/triagecheck/wrapper.go
        line: 63
        summary: >-
          ラッパーが渡す "$0 -write-summary" が叩いた形とカレントに依存するため、
          コミットされるサマリ 1 行目が起動方法ごとに変わり、生成直後のサマリが
          別の叩き方の検査で落ちる
        category: plugin-code
        audience: operator
        consequence:
          condition: >-
            ラッパーを導入した利用側で、生成と検査が違う叩き方で行われるとき
            (相対パスで生成し CI やエディタが絶対パスで検査する、PATH に置いた
            リンク経由で叩く、サブディレクトリから ../bin/rtc で叩く)
          who: operator
          what: >-
            サマリの内容は同一なのに 1 行目だけが食い違い、triagecheck が
            「サマリが正本と食い違っています」で exit 1 になる。再生成しても
            叩き方が違えば毎回差分が出続け、2 人が別の形で叩くと git 上で
            サマリが往復する
          detectability: >-
            CI が赤くなるので気づくが、原因は分かりにくい。案内される再生成
            コマンドを実行しても直らないため、利用者は記録の中身を疑う
        premise_check:
          stages: A
          result: verified
        gates_fired: []
        verdict: adopted
        verdict_reason: >-
          A2。全 4 ゲートを評価していずれも不発火。hypothetical は再現テストを
          実際に書いて FAIL させたので不成立。developer-domain は対象が利用者の
          環境で走るラッパーなので不成立。disproportionate-cost は対象
          (wrapper.go 155 行) に対し既存の同型テストが 61-112 行で釣り合うため
          不成立。already-visible は赤くなる関門を名前で挙げられない
          (TestInstallWrapperSummaryCommandPointsAtWrapper は生成も検査も
          ./bin/rtc の 1 形だけを使うため、この欠陥がある状態で緑になる) ので不成立
        attrs:
          severity: high
          verdict: CONFIRMED
      - id: 2
        file: review-triage/tools/triagecheck/main.go
        line: 72
        summary: >-
          -install-wrapper と -summary-command を併記すると指定が黙って捨てられる。
          -write-summary には同型のガードがあるのにこちらには無い
        category: plugin-code
        audience: operator
        consequence:
          condition: >-
            利用側が Makefile 経由の案内を焼き込むつもりで
            -install-wrapper と -summary-command を併記してラッパーを配るとき
          who: operator
          what: >-
            コマンドは exit 0 で「生成: ...」と表示して成功したように見えるが、
            生成されたラッパーに指定した文字列は一切入らず、案内は
            "$0 -write-summary" のままになる。利用者は意図と違う案内を
            配ったことに気づかない
          detectability: >-
            気づかない。生成は成功して見え、生成物を開いて grep しない限り
            指定が消えたことは分からない
        premise_check:
          stages: A
          result: verified
        gates_fired: []
        verdict: adopted
        verdict_reason: >-
          A2。全 4 ゲートを評価していずれも不発火。hypothetical は既存の
          TestRunInstallWrapperRejectsUnusedFlags と同じ形で再現テストを書けるので
          不成立 (実測でも exit 0 と grep 0 件を確認)。developer-domain は対象が
          利用者に配るラッパーの生成なので不成立。disproportionate-cost は
          既存ガードが 3 行 (条件 1 行 + return 2 行) で済んでおり不成立。
          already-visible は赤くなる関門を挙げられない (併用を検査する
          TestRunInstallWrapperRejectsUnusedFlags は -write-summary だけを試す)
          ので不成立
        attrs:
          severity: medium
          verdict: CONFIRMED
      - id: 3
        file: review-triage/tools/triagecheck/main_test.go
        line: 788
        summary: >-
          TestSummaryCommandDefaultIsGeneric が可変グローバル summaryCommand を
          読むため実行順に依存し、既定の回帰を検出しなくなる
        category: test
        audience: developer
        consequence:
          condition: >-
            withRunGlobals を呼ばずに run を呼ぶテストが 1 つでも増え、
            そのテストがこのテストより先に走るとき (このテスト自身は
            withRunGlobals を呼んでいない)
          who: developer
          what: >-
            既定値ではなく先行テストが残した汚染値を検査してしまう。
            record.go の既定が Issue #36 の焼き込みに戻されても、汚染値が
            無害な文字列であればこのテストは緑のまま通り、回帰を見逃す。
            逆に汚染値が make を含めば偽陽性で落ちる
          detectability: >-
            気づかない。テストは緑のまま通るので、検出能力が失われたことは
            回帰が実際に起きるまで分からない
        premise_check:
          stages: A
          result: verified
        gates_fired:
          - already-visible
        verdict: adopted
        verdict_reason: >-
          A1 (免除条項)。全 4 ゲートを評価し already-visible のみ発火したが、
          免除条項の 2 条件がともに成立するため却下しない。
          条件 1: 指摘は関門 (テスト) そのものが既定の回帰を検出しなくなることを
          主張しており、検出能力の消失に当たる。
          条件 2: この欠落を検出する関門が 3 層のいずれにも無い —
          層 1 (make ターゲット) はこのリポジトリに Makefile が無いため 0 件、
          層 2 (機械検査の項目) は review-triage-record と judgment-flow の 2 つで
          どちらも Go テストの順序依存を見ない、層 3 (テスト関数) には
          order/pollution/global/isolation を扱うテストが 1 件も無い (grep で確認)。
          なお already-visible の発火は go test 自体が赤くなりうる点によるが、
          それは汚染値が make を含む偽陽性の場合だけで、見逃しの側は緑のまま通る
        attrs:
          severity: low
          verdict: CONFIRMED
      - id: 4
        file: review-triage/tools/triagecheck/main.go
        line: 76
        summary: >-
          コマンド文字列の空判定に isBlankPath を再利用している。関数名と
          doc コメントが示す対象 (パス) と用途がずれている
        category: plugin-code
        audience: operator
        consequence:
          condition: >-
            将来 isBlankPath にパス特有の規則 (path.Clean、区切り文字の扱い、
            拡張子の検査など) を足したとき
          who: operator
          what: >-
            -summary-command が巻き添えで壊れ、パスとしては無効だが
            コマンド文字列としては正当な値が弾かれる、あるいはその逆が通る
          detectability: >-
            そのときテストが赤くなるかは、足す規則しだいで分からない。
            現時点では挙動は正しく、実害は出ていない
        premise_check:
          stages: A
          result: verified
        gates_fired:
          - hypothetical
        verdict: rejected
        verdict_reason: >-
          R3。全 4 ゲートを評価し hypothetical が発火した — 帰結が
          「将来 isBlankPath にパス特有の規則を足したら」という仮定の条件に
          依存しており、現在のコードでは再現するテストを書けない
          (現時点の挙動は空白・不可視の除去として正しく、実測でも空指定は
          errEmptySummaryCommand で正しく弾かれる)。再現には未着手の変更を
          先に入れる必要があり、それはテストで作れない。
          developer-domain・disproportionate-cost・already-visible は不発火。
          D7 の被害者は developer — 対象は同梱ツールだが、帰結が生じるのは
          このリポジトリの保守者が isBlankPath を変更する場面であり、
          その時点でコンパイルとテストを回す開発者が調べて対処できる。
          製品の利用者に届く経路が無いため却下する
        attrs:
          severity: low
          verdict: CONFIRMED
    notes: >-
      このブランチの初回トリアージ。レビューは code-review high で報告のみ
      (--fix 無し) で走らせ、実行前後で HEAD (33c62b8) と作業ツリーが不変で
      あることを確認した。
      プロジェクト設定 (.claude/akm-claude-plugins/review-triage/config.json) が
      無いため、記録の置き場は既存の docs/review-triage/ に合わせ、
      triage_summary_command / triage_check_command は未設定として扱った
      (サマリ再生成と検査の実行方法は報告に記す)。
      指摘 1 と 2 は同じ原因 (-summary-command を経路ごとに扱った結果、
      ラッパーの経路だけ規則から外れた) を共有する。README の
      「パスの規則は 3 つの経路で同じ」という設計を -summary-command には
      当てていないことが根にあり、review-triage-fix では 1 つの問題として
      束ねられる見込み。
      PR 説明で著者が挙げた懸念のうち、summaryCommand をパッケージ変数にした
      判断は指摘 3 の順序依存という形で表面化した。ラッパーの $0 設計は
      指摘 1 のとおり穴があった。シェルの引用符の扱いは "$summary_command" が
      単一 argv に収まることを空白・二重引用符を含むパスで実測し、問題なし。
      record_test.go の TestReviewTriageRecordSummaryStale の判定を
      「食い違っています」への一致に変えた点は、文言への結合ではあるが
      summaryCommand が可変になった以上コマンド名では判定できず、代替が
      無いため指摘として立てなかった。

      修正前の追加調査 (関連箇所と影響範囲) で分かったこと。fix の設計に効くので
      ここに残す。

      (1) 指摘 2 の修正には制約がある。ラッパーは -summary-command を必ず付けて
      渡し、生成物の末尾に "$@" があるため、利用者は `./bin/w -install-wrapper ...`
      と叩ける。この経路では -summary-command と -install-wrapper が同時に立つ。
      実測 (run() を直接呼ぶ probe) で、現状この組み合わせは通りラッパーが
      生成されることを確認した。したがって「explicit の同時成立」だけで弾く
      素朴なガードを足すと、この経路が壊れる。既存の併用ガードが
      -write-summary=false を通すために値も見ているのと同じ配慮が要る。
      ただしラッパーが渡す値 ("./bin/w -write-summary") と既定値
      ("triagecheck -write-summary") は一致しないため、値だけでは
      「ラッパー由来」と「利用者の明示」を見分けられない。ラッパー由来を示す
      印を持たせるか、ガードの条件を別の軸で立てる必要がある。

      (2) 指摘 3 と同型のグローバル依存が他にもある。可変のパッケージ変数は
      reviewTriageDir / judgmentFlowPath / summaryCommand の 3 つで、run() が
      いずれも書き換える。record_test.go と judgment_flow_test.go は
      reviewTriageDir / judgmentFlowPath をパスの組み立てに広く使っており
      (record_test.go だけで 20 箇所超)、これらは既定値のままであることを
      前提にしている。現時点では withRunGlobals を呼ばずに run() を呼ぶテストは
      無いことを確認したので実害は出ていないが、指摘 3 の修正を
      「このテストだけ const と比較する」で閉じると、同型の露出は残る。

      (3) サマリ 1 行目を検査するテストが 1 つも無い (grep で確認)。
      renderReviewTriageSummaryDoc は summaryCommand を 1 行目に埋めるが、
      その内容を期待値と突き合わせるテストは存在しない。指摘 1 の修正で
      1 行目の組み立て方を変えるなら、ここに関門を 1 つ置くのが自然。

      (4) 指摘 1 を直すと生成サマリの 1 行目がもう一度変わる。この PR で
      既に `make docs-review-triage-summary` から `triagecheck -write-summary`
      へ 1 度移行しており、修正は 2 度目の移行になる。このリポジトリの
      サマリ 3 件 + 今回追加の 1 件が対象。利用側にも同じ差分が出る。
      0.4.0 を出す前に直せば移行は 1 度で済む。

      (5) 修正時に追随が要る文書。-summary-command / triage_summary_command に
      触れているのは review-triage/README.md、tools/triagecheck/README.md
      (特に $0 の挙動を説明した 56 行目)、skills/review-triage/SKILL.md、
      references/project-config.md (32 行目がラッパーの自動受け渡しを前提に
      「設定は要らない」と書いている)、references/record-schema.md。
      指摘 1 で $0 の扱いを変えるなら、README 56 行目と project-config.md
      32 行目は記述が実装と食い違う。

      指摘 2 のガード条件の検討と、fix の設計 (人間と合意済み)。

      (6) ガードは立てない。見分ける手立てを 3 つ潰した — 引数の順序は
      flag.Visit が辞書順で回るため情報が無い (実測)。値の内容はラッパーが
      渡す値と既定値が一致しないため既存ガードの「値も見る」流儀を移植
      できない。シェル側で "$@" を走査する案はフラグ解析のシェルへの再実装で
      「列挙する検査は穴を再生産する」型。既存ガードが -write-summary を
      弾いてよかったのは両立しえない要求だったからで、-summary-command は
      -install-wrapper と両立する (生成するラッパーにこの案内を持たせよ)。
      正しくは捨てずに焼き込んで効かせること。これで指摘 1 と 2 は
      「ラッパーに何を焼き込むか」の 1 つの決定に収束する。

      (7) 焼き込む値の不変条件: コミットされる 1 行目に環境固有の値を
      入れない。同じコミットを dev (/Users/...) と CI (/home/runner/...) が
      検査するので、絶対パスを含むと同じコミットが場所によって赤くなる。
      この 1 条件で「基準が無ければ絶対パス」と「実行時に script_dir から
      組み立てる」の両案が落ちる。

      (8) 値の決め方 (経路の分岐より前で 1 回)。-summary-command が明示
      されればその値。明示が無く -install-wrapper があるときは
      filepath.Rel(-current-dir, ラッパーの絶対パス) + " -write-summary"
      (区切りを含まないときだけ ./ を前置。既存文書の
      `bin/<名前> -write-summary` の表記に合わせる)。このとき baseUsed を
      立てないと errCurrentDirUnused が誤発火する。明示も -current-dir も
      無いときはエラーで要求する — basename だけの案内は「PATH に居るはず」
      という推測で、-record-dir で退けた型と同じ。新しい規則ではなく、
      既存の「相対パスの基準は渡す側が決める」を案内という 1 つのパス値に
      当てるだけ。互換性: -install-wrapper /abs/w -record-dir /abs/rec
      (基準無し・明示無し) は今まで通っていたのがエラーになる。直し方は
      -current-dir "$(pwd)" を足すか -summary-command を渡すかの 1 行で、
      エラー文に両方を書く。0.4.0 未リリースのうちに揃える。

      (9) ラッパーがリポジトリ外にあるとき (../elsewhere/bin/rtc) は
      そのまま通す。-record-dir の焼き込みも同じ配置 (script_dir からの ../)
      を既に受け入れており、ここだけ規則を分けると経路ごとに違う契約になる。

      (10) 実装の細部。焼き込みの引用に %q は使えない — Go の規則であって
      シェルの二重引用符と食い違い、`make $(TARGET)` を焼き込むとシェルが
      展開して make だけになる (実測)。単一引用符で囲み、中の ' は '\'' に
      する。既存の -record-dir の %q は同じ穴だが今回は触らず、ここに残す。
      1 行目を検査するテストが 0 件なので、指摘 3 の修正で導入する既定値の
      定数を使って 1 つ置く。TestInstallWrapperSummaryCommandPointsAtWrapper は
      検査側を絶対パスで叩く形に変えれば、指摘 1 の再現がそのまま関門になる。

      (11) 束ねる順は P1 (指摘 1・2) → P2 (指摘 3)。P2 が使う定数を P1 で
      導入するため。
