          検査項目の列に「値の無い構造キー」を足す。
          順序: 影響範囲が広い (コード・テスト・スキーマ・README) のでこちらが先
        investigation:
          scope: >-
            record.go の yaml タグ付きフィールドのうち構造を持つもの全部 (ポインタ 2・
            構造体 2・スライス 5・map 1) と walker の case 全部を読み、
            plan_ref / investigation / consequence / premise_check を null にした
            フィクスチャで検査とサマリ生成をプローブ (一時テスト、実施後に削除)。
            docs/review-triage/*.yaml 5 ファイルを yaml.v3 で走査し、構造キーが
            null の形が無いことを確認
          included:
            - "plan_ref (record.go:96): 同じポインタ nil の判定で、plan_ref: と書いて値を省くと plans がある回でも plans の無い最後の回でも問題 0 件 (プローブで実測)"
            - "triagecheck README:11 の検査項目の列: 必須キーの粒度に収まらない新しい項目なので追随させる"
          excluded:
            - "consequence / premise_check の null: 必須サブキーの欠落として既に報告される。重ねると 1 つの書き忘れが複数の問題になる"
            - "スライス (included / excluded / gates_fired / depends_on / plans / findings) の null: 空と同義でスキーマも「無ければ省略」としている"
            - "record.go:8・64 のコメントが正本を docs/review-triages/README.md と指す取り残し: 移植時の別原因なので含めない"
        order: 1
        status: done
        sha: 6126c54
      - problem_id: P2
        cause: >-
          Issue #38 の「型 A〜F はコミット前の検査」という文を、正本 verification.md
