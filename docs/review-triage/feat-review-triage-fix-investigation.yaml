        attrs:
          severity: P3
          confidence: high
    plans:
      - problem_id: P1
        cause: >-
          構造を持つ任意キー (investigation) の有無をポインタの nil で見たため、
          「キーを書いて値を省いた (YAML の null)」が「キーが無い」と同一になった。
          未知キーの walker も値が mapping でなければ何も見ずに抜ける
        finding_ids: [2]
        approach: >-
          recordUnknownKeyProblems の walker で、mapping を期待するキーのうち null が
          他の検査で赤くならないもの (plan_ref・investigation) の値が null なら
          「値がありません (書くなら中身を、書かないならキーごと消す)」と報告する。
          consequence / premise_check は必須サブキーの欠落として既に報告されるので
          対象にしない (重ねると 1 つの書き忘れが 5 件になる)。
          TestReviewTriageRecordSchemaViolations に investigation: (null) と
          plan_ref: (null) の 2 ケースを足す。record-schema.md の調査の節と plan_ref 行に
