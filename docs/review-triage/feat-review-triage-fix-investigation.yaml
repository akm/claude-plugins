runs:
  - date: "2026-09-03"
    skill: code-review
    run_id: ""
    model: opus-5
    level: ""
    scope: full
    head: 64fa3b2
    findings:
      - id: 1
        file: review-triage/skills/review-triage-fix/references/investigation.md
        line: 5
        summary: >-
          「検証 (型 A〜F) はコミット前にかかる」と全称で述べているが、正本の
          verification.md は型を「書いている最中 (A・C・F)」と「コミット前 (B・D・E)」に
          分けており矛盾する。同ファイル 63 行目は型 A を調査の段階で当てていて、
          内側でも矛盾している
        category: skill
        audience: operator
        consequence:
          condition: 利用者 (とスキルを実行するエージェント) が investigation.md を読んで、調査と検証のフェーズの違いを理解しようとするとき
          who: operator
          what: >-
            「型 A〜F はコミット前」を信じて、書いている最中に当てるべき A・C・F を
            コミット前まで持ち越す (実行で確かめられる主張を記憶で書いて後から直す)。
            または 5 行目と 63 行目のどちらが正しいか分からず、正本を読みに行く
          detectability: 気づかない — 文の矛盾を捕まえる機械検査は無く、リンク検査は文面を見ない
        premise_check:
          stages: A
          result: verified
        gates_fired: []
        verdict: adopted
        verdict_reason: >-
          A2。段 A: investigation.md:5 と verification.md:11 を逐語で読み比べ、
          指摘どおり verification.md が A・C・F を「書いている最中」に置いているのを確認した。
          investigation.md:63 が型 A を scope の記述時に当てているのも確認した。
          全 4 ゲートを評価して発火 0 件 — hypothetical: 読めば再現する。
          developer-domain: 対象はスキル文書で利用者に届く。disproportionate-cost:
          修正は 1 文の書き換え。already-visible: 文の矛盾を検出する関門は無い。
          免除条項は検出能力の主張ではないので対象外
        attrs:
          severity: P2
          confidence: high
      - id: 2
        file: review-triage/tools/triagecheck/record.go
        line: 535
        summary: >-
          `investigation:` とキーだけ書いて値を省いた記録 (YAML の null) が検査を
          素通りし、サマリにも出ない。`investigation: {}` は scope 欠落として報告
          されるので、値の書き方だけで挙動が割れる
        category: plugin-code
        audience: operator
        consequence:
          condition: 書き手が手順 4 に従って investigation キーを立て、scope を書く前に中断した、または箇条書きのインデントを誤って値が null になったとき
          who: operator
          what: >-
            検査が緑のまま通り、サマリに調査の行が出ない。書き手は調査済みのつもりだが
            記録上は「未調査」と同一になり、次の回で調査漏れか新規かを判別する材料が消える
          detectability: 気づかない — 検査は緑、サマリは無表示、キーは YAML に残っているので目視でも見過ごす
        premise_check:
          stages: A
          result: verified
        gates_fired: []
        verdict: adopted
        verdict_reason: >-
          A2。段 A: レビュアと同じプローブ (一時テストで `investigation:` /
          `investigation: null` / `investigation: {}` の 3 形を validRecordYAML に
          入れて検査とサマリ生成を通す) を自分で実行し、null の 2 形は問題 0 件・
          調査の行なし、{} は scope 欠落を報告することを確認した。実施後に一時
          ファイルを消し、作業ツリーが空・HEAD が 64fa3b2 であることを確認した。
          record-schema.md は「無いことは未調査」と定めるが、キーが書かれて値が
          null の形は定めておらず、検査もそこを区別しない。
          全 4 ゲートを評価して発火 0 件 — hypothetical: テストで再現できる
          (プローブがそのままテストになる)。developer-domain: 検査は利用者の記録に
          かかる。disproportionate-cost: null の検出は数行で、対象の検査ブロックより
          小さい。already-visible: null の形を踏むテストは無い
          (TestReviewTriageRecordSchemaViolations は {} の形だけ)。
          免除条項は対象外
        attrs:
          severity: P2
          confidence: high
      - id: 3
        file: review-triage/skills/review-triage-fix/SKILL.md
        line: 33
        summary: >-
          手順 4 の `plans[].investigation` の参照だけがアンカー無しのファイル参照で、
          同じ SKILL.md の手順 6・手順 7 の正本参照が節アンカーを持つのと食い違う。
          investigation.md:63 も同じくアンカー無し
        category: skill
        audience: operator
        consequence:
          condition: record-schema.md の「調査」節の見出しが改名されたとき、または読み手がリンクから様式の表へ直接飛ぼうとしたとき
          who: operator
          what: >-
            リンクはファイル先頭に届き、読み手は地の文の「`plans[].investigation` の表」を
            頼りに表を探す。地の文はキー名で指しているので見出しの改名では古くならず、
            壊れるものは無い — 増えるのは探す手間だけ
          detectability: 気づかない — 地の文はアンカー検査の対象外だが、古くなる条件 (キー名の改名) では他の全箇所も同時に直す
        premise_check:
          stages: none
          result: skipped
        gates_fired: []
        verdict: rejected
        verdict_reason: >-
          R2 (空虚)。指摘は「様式の正本への参照に節アンカーを付けて、同じファイルの
          手順 6・7 の形に揃える」と読んだ。逐語引用は正しいが、帰結の「何が」を
          壊れる形で書けない — 参照は `plans[].investigation` というキー名で表を
          指しており、見出しの改名では古くならない。また同じ SKILL.md の 10・28・46
          行目 (スキーマ表・状態の表への参照) も同じアンカー無しの形で、投稿の
          「この参照だけが列に入らない」は成り立たない (アンカー付きは手順 6・7 の
          2 箇所で、ファイル内で両方の形が混在している)。依頼文の「整理・統一の好み
          (放置して壊れるものが無いもの)」に当たる。
          なお evidence の「6 件がヒット」は自分の実行では 7 行 (両スキルの SKILL.md と
          committing.md) — 結論には影響しない
        attrs:
          severity: P3
          confidence: high
    notes: >-
      このブランチの初回トリアージ (Issue #38 の対応。full、main 08479a1..64fa3b2)。
      別セッションのレビュー結果を tmp/review-code-review-opus-5-6th.yaml で受領した。
      head は現在の HEAD と一致し、レビュー前後で HEAD と作業ツリーが不変であることを
      レビュア側の報告と自分の git status で確認した。
      プロジェクト設定 (.claude/akm-claude-plugins/review-triage/config.json) が
      無いため、記録の置き場は既存の docs/review-triage/ に合わせ、
      triage_summary_command / triage_check_command は未設定として扱い、
      サマリ生成と検査は tools/triagecheck を go run で直接叩いた。
      関門の一覧 (gates) も無いので免除条項は使っていない (今回は対象の指摘も無い)。
      residual 5 件のうち記録に残す価値があるもの:
      (a) investigation.md の「後ろ向きの調査」の表と verification.md の型 B / D / E の
      対象が部分的に重なる。Issue #38 は型 G として足さないと決めており、重なりは
      「調査で範囲に入れる対象」と「コミット前に読み直す対象」が同じものを指す構造
      によるもの。doc-dag で見る対象。
      (b) status: awaiting-human の問題にも investigation を書けるが、書くべきかを
      スキーマも SKILL.md も述べていない。手順 4 は手順 5 より前なので書けるのが自然。
      規則としては未定義のまま残す — 実装しない問題の調査結果が要るかは運用で見る。
      (c) renderInvestigation の要素の区切り「; 」は要素自身が「; 」を含むと境目が
      読めない。箇条書きの行で表のセルではないので、読みにくさに留まる。
      (d) triagecheck README の検査項目の列に investigation.scope の必須検査が明示
      されないが「必須キー」に含まれる粒度なので追随漏れとはしない。
