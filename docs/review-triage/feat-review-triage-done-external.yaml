runs:
  - date: "2026-09-01"
    skill: code-review
    model: opus-5
    scope: full
    head: 9654d3a
    findings:
      - id: 1
        file: review-triage/tools/triagecheck/record.go
        line: 636
        summary: >-
          サマリの修正計画の表で、証拠の列の見出しが SHA のままなのに、done-external の行には
          applied_external_url の URL が入る。見出しと中身の型が食い違う。
        category: plugin-code
        audience: operator
        consequence:
          condition: done-external の問題を含む記録のサマリ (.md) を読むとき
          who: operator
          what: 見出し SHA の列に URL が出る。列の意味を推測させ、URL を SHA として読む余地を残す
          detectability: >-
            気づかない。サマリの鮮度検査は YAML から生成した内容と .md の一致だけを見るので、
            見出しと中身の型の食い違いは生成の両側で同じになり検出されない
        premise_check:
          stages: A
          result: verified
        verdict: adopted
        verdict_reason: >-
          A2 — 段 A で見出し (record.go:636) と renderPlanCells の URL 分岐 (record.go:720-729) を
          逐語で確認し一致。全ゲートを評価して発火 0 件 (テストで再現でき仮定でない・環境の異常でなく
          対象も利用者が読むサマリ・修正は見出しの文字列 1 箇所で不相応でない・赤くなる関門を挙げられない)
        attrs:
          severity: P2
          confidence: high
      - id: 2
        file: review-triage/skills/review-triage/references/record-schema.md
        line: 68
        summary: >-
          スキーマ表は applied_external_url を done-external のときだけ書くと規定するが、検査は
          それを守らない。pending / done / awaiting-human に書いても無言で通る。
        category: skill
        audience: operator
        consequence:
          condition: done-external 以外の状態の問題に applied_external_url や notes を書いたとき
          who: operator
          what: >-
            検査が通るので、done でコミット済みなのに外部 URL が残る記録が作れる。
            正本の規定が機械検査で守られない箇所になる
          detectability: >-
            気づかない。検査は status の枝ごとに見るキーを決めており、枝の外のキーは評価しない
        premise_check:
          stages: A
          result: verified
        verdict: adopted
        verdict_reason: >-
          A2 — 段 A で表の行 (record-schema.md:68) と status の switch (record.go:454-478) を照合し、
          done-external の枝以外が AppliedExternalURL / Notes を見ないことを確認。実際に 3 通り
          (pending+url / done+url / awaiting-human+notes) を検査に通して問題 0 件を再現した。
          全ゲートを評価して発火 0 件。なお同じ排他を持つ sha は検査されており (record.go:456)、
          applied_external_url だけが規定と検査で食い違う
        attrs:
          severity: P3
          confidence: high
      - id: 3
        file: review-triage/skills/review-triage/references/record-schema.md
        line: 96
        summary: >-
          「だから notes に反映を確認した方法を書く」と規範は述べるが、検査は URL か notes の
          どちらかで通す。URL だけの記録は検査を通り、サマリにも反映済みの行が出ない。
        category: skill
        audience: operator
        consequence:
          condition: リポジトリ外の反映先に URL がある場合 (PR 本文の修正など。最も起きやすい経路)
          who: operator
          what: >-
            反映を確認した方法がどこにも残らない記録が作れる。URL は現在の本文を返すだけで
            修正の前後を判別できないため、後から反映の有無を確かめる手段が無くなる
          detectability: >-
            気づかない。検査は URL があれば notes を要求せず、サマリ生成も notes が空なら
            表の外の行を出さないので、欠落を知らせる経路が一つも無い
        premise_check:
          stages: A
          result: verified
        gates_fired: [already-visible]
        verdict: adopted
        verdict_reason: >-
          A1 — 免除条項。条件 1: 指摘は機械検査 (triagecheck) が規範の要求を検出しないこと、
          すなわち検出能力の欠落を主張している。条件 2: 3 層から候補を挙げていずれも検出しない —
          make ターゲットはこのリポジトリに Makefile が無く存在しない / 検査項目は
          review-triage-record と judgment-flow の 2 つで、前者は status の枝ごとのキーしか見ず
          後者は判定フローの図と表の照合なので対象外 / テスト関数は
          TestReviewTriageRecordDoneExternalPasses が「URL だけで通る」ことを逆に固定しており
          欠落を検出しない。URL のみ (notes 無し) を実際に検査とサマリ生成へ通し、問題 0 件かつ
          「リポジトリ外へ反映済み」の行が出ないことを再現した
        attrs:
          severity: P2
          confidence: high
    plans:
      - problem_id: P1
        cause: >-
          証拠の欄の役割を SHA から証拠に広げたとき、セルを埋めるコードだけを直し、
          同じ関数の呼び出し元にある見出しの文字列に追随しなかった
        finding_ids: [1]
        approach: >-
          サマリの修正計画の表の見出しを SHA から 証拠 (SHA / URL) に変え、列が 2 つの型を
          取ることを見出しで示す。既存の記録のサマリは再生成で追随する
        order: 1
        sha: 9ede54b
        status: done
      - problem_id: P2
        cause: >-
          status の枝ごとにキーを検査する既存の形にキーを足したとき、
          done-external のときだけ書くという排他をスキーマ表に書いておきながら、検査に写さなかった
        finding_ids: [2]
        approach: >-
          done-external 以外の枝で applied_external_url と notes が空であることを検査する。
          排他を検査する既存の sha (pending / awaiting-human の枝) と同じ形に揃える
        order: 2
        sha: 495f4a0
        status: done
      - problem_id: P3
        cause: >-
          URL か notes のどちらかを必須にするという検査の規則を決めた後、同じ節に前から
          書いてあった「だから notes に反映を確認した方法を書く」という無条件の文を読み直さなかった
        finding_ids: [3]
        approach: >-
          規範の文言を検査に合わせて緩める (人間が選択)。notes を無条件に要求する文を、
          URL があっても確認方法を残すことを推奨する文に改め、必須なのは
          「URL か notes のどちらか」であることを明記する。検査は変えない
        order: 3
        sha: d29d3c8
        status: done
    notes: >-
      レビューは報告のみで走った (head 9654d3a が現在の HEAD と一致、作業ツリーは不変)。
      指摘 3 件はいずれも、この差分自身が「正本と実装の乖離」を直す変更であるにもかかわらず、
      同じ型の乖離を新たに作っている点を突いている。#2 と #3 は record-schema.md (正本) と
      record.go (検査) の食い違いで、依頼文で重点として挙げた箇所からそのまま出た。
      residual の 3 件に目を通した。1 つ目 (SKILL.md 手順 7 の報告対象が done-external に触れない)
      は、done-external が再開対象外である以上、報告しなくても壊れるものが無いという読みに同意する。
      2 つ目 (notes が run 直下と plans 直下の両方にある) は階層が違い YAML として曖昧にならない。
      3 つ目 (.tool-versions が指す golang 1.25.4 が未インストール) はこの差分と無関係だが、
      レビュアがテストを走らせられるよう依頼文で 1.25.1 の直接指定を案内した。
      P3 は規範と検査のどちらを動かすかの設計判断を含むため review-triage-fix が
      人間に返し、「規範の文言を検査に合わせて緩める」が選ばれた。もう一方の案
      (検査を厳しくして notes を無条件に必須にする) は、URL を持たない対象のために
      notes を逃がし弁として残した設計と衝突するため採らなかった。
  - date: "2026-09-01"
    skill: code-review
    model: opus-5
    scope: incremental
    head: 3049713
    findings: []
    notes: >-
      前回の 3 件を直した増分 (9654d3a..3049713) の再レビュー。指摘 0 件で収束した。
      レビューは報告のみで走った (head が現在の HEAD と一致、作業ツリーは不変)。
      依頼文で重点として挙げた 4 点 (修正が別の欠陥を生んでいないか / P2 の検査の網羅と過剰 /
      P3 で緩めた文言と他の箇所の整合 / 追加したテストが意図した失敗を捕まえるか) は、
      いずれも指摘に至らなかった。
      residual の 3 件に目を通した。1 つ目は採るべき指摘だが増分の外にある — record-schema.md:19
      の「review-triage-fix が書き換える」キーの列挙が status / sha / options のままで、
      done-external の追加で必要になった applied_external_url / notes が入っていない。
      該当行が fa7a8ab 以来この増分で触られていないこと、増分に含まれないことを確認した。
      受け渡しの契約の記述としては不完全なので、次の回で直す対象として残す。
      2 つ目 (必須キーの検査が空白のみの値を通す) は、cause / approach / verdict_reason など
      既存の必須キーもすべて同じ扱いで、この差分が作った型ではない。直すなら全キー一律の
      別の変更になる。3 つ目 (externalOnly の呼び出しが各枝に散る) は、default に重ねない意図が
      コメントとテストで守られているという観察に同意する。
  - date: "2026-09-01"
    skill: code-review
    model: opus-5
    scope: incremental
    head: dd4c332
    findings: []
    notes: >-
      回 2 の residual 1 件 (書き換えるキーの列挙が古い) を直した増分
      (3049713..dd4c332) の再レビュー。指摘 0 件。列挙に 2 つ足すのではなく、列挙自体をやめて
      plans[] のスキーマ表への参照に変えた — キーを足すたびに手で同期が要る形が漏れの原因のため。
      レビューは報告のみで走った (head が現在の HEAD と一致、作業ツリーは不変)。
      residual の 3 件に目を通し、いずれも欠陥ではなく観察として扱う。
      1 つ目は依頼文の重点 4 (列挙をやめた理由に実測を書いたことが「規範文書に実測値を書かない」に
      触れないか) への回答で、戒めの対象は件数・比率であり数を持たない事象の記述は対象外という
      読みを採る。同じ文書の 21 行目に「実測で原因の記述が丸ごと消えた」という同型の先例があること、
      数を持つ実測は 15 行目と 113 行目の側であることを自分で確かめた。
      2 つ目 (地の文の参照はアンカー切れ検査に掛からず、将来の改名を捕まえられない) は事実だが、
      リンク記法にすると引用中のリンクの扱いと衝突する。現状は参照先の実在を目視で確認した。
      3 つ目は依頼文の重点 1 (「plans の各キー」という一般化が真か) への回答。plans の 11 キーを
      数え、いずれも review-triage-fix が書く (手順 5 で計画を書き手順 6 で更新する) ことを
      確かめた。一般化は成り立つが、この規範に機械検査が無いことも併せて記録に残す。
  - date: "2026-09-01"
    skill: code-review
    model: opus-5
    scope: full
    head: 7003aa2
    findings:
      - id: 1
        file: review-triage/skills/review-triage-fix/references/committing.md
        line: 43
        summary: >-
          done-external の書き方を述べる規範が review-triage-fix の SKILL.md 手順 6 と
          committing.md に複製されており、正本 (record-schema.md) がこの増分で 4 回変わる間
          どちらも一度も追随していない。
        category: skill
        audience: operator
        consequence:
          condition: 次に done-external の検査の要求や書き方を変えるとき
          who: operator
          what: >-
            正本を直しても複製 2 箇所は黙って古くなり、利用者が古い規則に従って記録を書く。
            現に P3 で正本に足した「URL を書いた場合も notes を残すことを勧める」は複製から見えない
          detectability: >-
            気づかない。文書間の重複を検出する関門が無い (triagecheck の 2 検査はいずれも対象外、
            テスト関数 TestJudgmentFlowDuplicateTableRow は judgment-flow.md の表の行が対象)
        premise_check:
          stages: A
          result: verified
        verdict: adopted
        verdict_reason: >-
          A2 — 段 A で 2 箇所を逐語で照合し、中核の指示文 (status: done-external にし、
          applied_external_url か notes を書く) が同一であることを確認。git log で正本が
          495f4a0 / d29d3c8 / 3049713 / dd4c332 の 4 回変わる間、複製 2 ファイルが 0 回であること、
          「勧める」「推奨」が複製に 0 件であることも確かめた。全ゲートを評価して発火 0 件
          (再現は現に起きており仮定でない / 環境の異常でなく対象は利用者が読むスキル定義 /
          修正は 2 箇所を参照に変えるだけで対象より小さい / 赤くなる関門を名前で挙げられない)。
          なお指摘の「一字一句同一」は誇張で、SKILL.md には複製に無い一文がある。
          同一なのは中核の指示文で、指摘の主旨は成り立つ
        attrs:
          severity: P3
          confidence: high
    plans:
      - problem_id: P4
        cause: >-
          done-external を足したとき、正本に書いた規則を review-triage-fix の 2 つの文書にも
          本文として書き写し、参照で済ませなかった。以後、正本だけを 4 回直した
        finding_ids: [1]
        approach: >-
          複製した規則の本文を消し、正本 (record-schema.md のリポジトリ外への反映) への参照に変える。
          3049713 で正本の中の同型の重複を参照に変えたのと同じ形に揃える。両ファイルとも既に
          正本へのリンクを持つので、指示の実体を削って参照だけを残せばよい。
          リポジトリ全体を grep し、記録 (過去の回) を除く波及先がこの 2 箇所だけであることを確認済み
        order: 1
        sha: ""
        status: pending
    notes: >-
      マージ前の最終確認 (全量)。増分レビューが構造上見られなかった型が 1 件出た — 正本が
      4 回変わる間に複製が 0 回という履歴は、各変更の局所しか見ない増分では見えない。
      3049713 で正本の中の同型の重複を参照に変えたのに、この 2 箇所だけ同じ扱いを受けていなかった。
      レビューは報告のみで走った (head が現在の HEAD と一致、作業ツリーは不変)。
      residual の 5 件に目を通した。1 つ目 (status done の sha 必須の分岐が未踏) は main 時点から
      存在し、この増分は文言だけを変えたので増分が作った型ではない。2 つ目 (recordStatusJa /
      recordVerdictJa の末尾の return が未踏) は列挙違反を検査側が報告するため到達しない防御。
      3 つ目 (plans 直下の notes が done-external 専用になった) は run 直下の notes と階層で
      区別され不整合が無いという観察に同意する。4 つ目と 5 つ目は依頼文の重点 2 と 5 への回答で、
      状態 4 つ x 証拠キー 3 つの全 32 通りに空白も矛盾も無いこと、0.3.0 が後方互換の追加として
      semver に合うことを確かめた結果である。
