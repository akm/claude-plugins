version: 2

# work-log-gh-comment の eval は「出力に現れた機密に気づけるか」を測るもので、
# 題材のトークンは本物らしい形をしていなければ意味がない (fixtures/register-site.sh
# の末尾に、架空の値であることと、なぜ本物らしくするのかを書いてある)。
# GitGuardian はその狙いどおりに反応するので、eval の配下だけを対象から外す。
#
# 外すのはこのディレクトリだけで、リポジトリ全体の検査は残す。
secret:
  ignored_paths:
    - 'work-log-gh-comment/skills/work-log-gh-comment/evals/**'

  # 値そのものでも外す。eval の題材が別の場所 (SKILL.md の例示など) に
  # 引かれたときに、パスの指定だけでは漏れるため。
  ignored_matches:
    - name: work-log-gh-comment eval の架空の登録トークン
      match: lappds_enr_7Kx9mQ2vR4tL8wN1pZ6yB3jH5sD0aF
    - name: work-log-gh-comment eval の架空の更新トークン
      match: lfds_upd_Wq4Er7Ty1Ui8Op2As5Df9Gh3Jk6Lz0Xc
